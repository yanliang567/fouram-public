# Based on the configuration of `case_params_all.yaml`, the following configuration is only used for MilvusClient.
# The new parameter is only used in MilvusClient; it will not take effect if the same parameter is used in ORM.


common_params:
  # during the preparation phase, select a subset of fields from the collection based on `partial_update_fields` to generate the write data
  # the default is to generate data for all fields normally, excluding data from dynamic fields
  # Reuse `partial_update_fields` parameter of `upsert` as the fields to be written during the preparation phase
  #  - None: the default setting is to write all non-dynamic fields
  #  - []: writing empty data is only possible when `autoID` is enabled, and when all other fields are nullable
  # In other scenes, the primary key field "id" must be selected
  partial_update_fields: Optional[list] = None
concurrent_tasks:
  - type: insert
    params:
      # when setting nullable fields, you can select only some fields to write data
      # e.g.:
      #   'id': primary key, auto id
      #   'float_vector': nullable
      #   'varchar': nullable
      #  partial_update_fields=[] -> insert data=[{}, ... <insert batch size>]: writing empty data, but the number of data rows inside Milvus increases
      partial_update_fields: Optional[list] = None
